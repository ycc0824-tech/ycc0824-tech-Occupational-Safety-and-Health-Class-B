<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
    body {
      font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
      background-color: #f1f5f9;
      color: #1e293b;
    }
    .ghs-diamond {
      width: 64px;
      height: 64px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-[#0f4c81] text-white shadow-md sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-lg md:text-xl font-bold tracking-wide">職業安全衛生術科互動式題庫系統</h1>
        <p class="text-xs text-sky-200">整合第一至第五單元完整題庫 ＋ 必考重點精選題庫池（共 <span id="total-count-badge">0</span> 題）</p>
      </div>
      <div class="flex items-center gap-2">
        <button id="btn-mode-practice" onclick="setMode('practice')" class="px-3 py-1.5 rounded-lg text-sm font-bold bg-white text-[#0f4c81] shadow transition">
          ✍️ 互動練習模式
        </button>
        <button id="btn-mode-study" onclick="setMode('study')" class="px-3 py-1.5 rounded-lg text-sm font-bold bg-sky-800 text-white hover:bg-sky-700 transition">
          📖 題解整合總覽
        </button>
      </div>
    </div>
  </header>

  <!-- Control Bar -->
  <div class="bg-white border-b border-slate-200 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex flex-wrap items-center gap-2">
        <label for="unit-filter" class="text-sm font-bold text-slate-700">題庫範圍：</label>
        <select id="unit-filter" onchange="applyFilter()" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm bg-slate-50 font-medium focus:outline-none focus:ring-2 focus:ring-[#0f4c81]">
          <option value="all">全部題庫池（全單元整合）</option>
          <option value="u1">第一單元：法規基礎與基礎計算</option>
          <option value="u2">第二單元：設備標準、共同作業與工程計算</option>
          <option value="u3">第三單元：圖示配對、危害防護與管理理論</option>
          <option value="u4">第四單元：設施安全基準與綜合職災統計分析</option>
          <option value="u5">第五單元：環境監測、健康計畫與工程防護計算</option>
          <option value="u6">第六單元：必考重點精選（組織/檢查/職業病/公式）</option>
          <option value="calc">🔥 僅篩選計算題型</option>
          <option value="wrong">❌ 錯題複習本 (<span id="wrong-count-opt">0</span>)</option>
        </select>

        <input id="search-input" type="text" oninput="applyFilter()" placeholder="搜尋關鍵字（如：鍋爐、WBGT、漏電...）" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm w-56 md:w-64 focus:outline-none focus:ring-2 focus:ring-[#0f4c81]" />
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <button id="btn-shuffle" onclick="shufflePool()" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-amber-100 text-amber-800 hover:bg-amber-200 transition">
          🔀 隨機洗牌出題
        </button>
        <button id="btn-toggle-all-ans" onclick="toggleAllStudyAnswers()" class="hidden px-3 py-1.5 rounded-lg text-xs font-bold bg-emerald-100 text-emerald-800 hover:bg-emerald-200 transition">
          👁️ 隱藏／顯示全部答案
        </button>
        <button onclick="resetProgress()" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">
          🔄 重置作答紀錄
        </button>
      </div>
    </div>
  </div>

  <!-- Stats Strip -->
  <div class="max-w-6xl w-full mx-auto px-4 pt-4">
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-white p-3 rounded-xl border border-slate-200 shadow-sm text-center">
      <div>
        <div class="text-xs text-slate-500">目前篩選題數</div>
        <div id="stat-filtered" class="text-lg font-bold text-[#0f4c81]">0</div>
      </div>
      <div>
        <div class="text-xs text-slate-500">已作答題數</div>
        <div id="stat-answered" class="text-lg font-bold text-slate-800">0</div>
      </div>
      <div>
        <div class="text-xs text-slate-500">答對題數</div>
        <div id="stat-correct" class="text-lg font-bold text-emerald-600">0</div>
      </div>
      <div>
        <div class="text-xs text-slate-500">答對率 / 錯題數</div>
        <div class="text-lg font-bold text-rose-600"><span id="stat-rate">0%</span> <span class="text-xs text-slate-400">(<span id="stat-wrong">0</span>錯)</span></div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <main class="max-w-6xl w-full mx-auto px-4 py-5 flex-1">
    <!-- Practice Mode View -->
    <div id="practice-view" class="space-y-4">
      <div class="flex items-center justify-between bg-white px-4 py-2.5 rounded-xl border border-slate-200 shadow-sm">
        <button onclick="prevQuestion()" class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-sm font-bold text-slate-700">⬅ 上一題</button>
        <div class="text-sm font-bold text-slate-700">
          第 <span id="curr-index" class="text-[#0f4c81] text-base">1</span> / <span id="curr-total">0</span> 題
        </div>
        <button onclick="nextQuestion()" class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-sm font-bold text-slate-700">下一題 ➡</button>
      </div>

      <div id="single-question-container"></div>
    </div>

    <!-- Study Mode View (All Questions + Answers Integrated) -->
    <div id="study-view" class="hidden space-y-4"></div>
  </main>

  <footer class="bg-white border-t border-slate-200 py-3 text-center text-xs text-slate-500">
    職業安全衛生術科練習題整合題庫池｜支援單選、複選、填空排序、圖示配對與計算題演練

  {

    title: "精選 11. 化學濃度換算、燃燒下限估算與研磨輪周速度計算",
    stem: "(1) 常溫常壓下，苯（分子量 78）濃度為 10 ppm，換算為 mg/m³ 為多少？\n(2) 某可燃性氣體完全燃燒理論混合比 C_st 為 4.0%，以 Jones 經驗公式估算燃燒下限 LEL 為多少%？\n(3) 研磨輪直徑 300 mm、轉速 2,000 rpm，圓周速度 V 為多少 m/min？（π 取 3.1416，四捨五入至小數第2位，答案空一格）",
    placeholder: "31.90 2.20 1884.96",
    answer: "31.90 2.20 1884.96",
    law: "安全衛生工程核心計算公式",
    explanation: "(1) mg/m³ = (10 × 78) ÷ 24.45 ≈ 31.90 mg/m³\n(2) LEL = 0.55 × C_st = 0.55 × 4.0% = 2.20%\n(3) V = π × D × N = 3.1416 × 0.3 m × 2,000 rpm = 1,884.96 m/min"
  }
];

// Application State
let currentMode = 'practice'; // 'practice' | 'study'
let filteredQuestions = [...questionPool];
let currentIdx = 0;
let userProgress = {}; // { [id]: { userAns, isCorrect, submitted } }
let studyHideAnswers = false;

document.getElementById('total-count-badge').textContent = questionPool.length;

function setMode(mode) {
  currentMode = mode;
  const btnPrac = document.getElementById('btn-mode-practice');
  const btnStudy = document.getElementById('btn-mode-study');
  const btnToggleAns = document.getElementById('btn-toggle-all-ans');

  if (mode === 'practice') {
    btnPrac.className = "px-3 py-1.5 rounded-lg text-sm font-bold bg-white text-[#0f4c81] shadow transition";
    btnStudy.className = "px-3 py-1.5 rounded-lg text-sm font-bold bg-sky-800 text-white hover:bg-sky-700 transition";
    document.getElementById('practice-view').classList.remove('hidden');
    document.getElementById('study-view').classList.add('hidden');
    btnToggleAns.classList.add('hidden');
    renderPracticeQuestion();
  } else {
    btnStudy.className = "px-3 py-1.5 rounded-lg text-sm font-bold bg-white text-[#0f4c81] shadow transition";
    btnPrac.className = "px-3 py-1.5 rounded-lg text-sm font-bold bg-sky-800 text-white hover:bg-sky-700 transition";
    document.getElementById('practice-view').classList.add('hidden');
    document.getElementById('study-view').classList.remove('hidden');
    btnToggleAns.classList.remove('hidden');
    renderStudyList();
  }
}

function applyFilter() {
  const unitVal = document.getElementById('unit-filter').value;
  const kw = document.getElementById('search-input').value.trim().toLowerCase();

  filteredQuestions = questionPool.filter(q => {
    let unitMatch = true;
    if (unitVal === 'calc') unitMatch = q.isCalc === true;
    else if (unitVal === 'wrong') unitMatch = userProgress[q.id] && userProgress[q.id].submitted && !userProgress[q.id].isCorrect;
    else if (unitVal !== 'all') unitMatch = q.unit === unitVal;

    let kwMatch = true;
    if (kw) {
      const blob = `${q.title} ${q.stem} ${q.law} ${q.explanation} ${Array.isArray(q.answer) ? q.answer.join(' ') : q.answer}`.toLowerCase();
      kwMatch = blob.includes(kw);
    }
    return unitMatch && kwMatch;
  });

  currentIdx = 0;
  updateStats();
  if (currentMode === 'practice') renderPracticeQuestion();
  else renderStudyList();
}

function shufflePool() {
  for (let i = filteredQuestions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filteredQuestions[i], filteredQuestions[j]] = [filteredQuestions[j], filteredQuestions[i]];
  }
  currentIdx = 0;
  if (currentMode === 'practice') renderPracticeQuestion();
  else renderStudyList();
}

function resetProgress() {
  if (!confirm('確定要清除所有作答與錯題紀錄嗎？')) return;
  userProgress = {};
  updateStats();
  if (currentMode === 'practice') renderPracticeQuestion();
  else renderStudyList();
}

function updateStats() {
  const total = questionPool.length;
  let answered = 0, correct = 0, wrong = 0;
  Object.values(userProgress).forEach(p => {
    if (p.submitted) {
      answered++;
      if (p.isCorrect) correct++;
      else wrong++;
    }
  });
  document.getElementById('stat-filtered').textContent = filteredQuestions.length;
  document.getElementById('stat-answered').textContent = answered;
  document.getElementById('stat-correct').textContent = correct;
  document.getElementById('stat-wrong').textContent = wrong;
  document.getElementById('wrong-count-opt').textContent = wrong;
  document.getElementById('stat-rate').textContent = answered > 0 ? Math.round((correct / answered) * 100) + '%' : '0%';
}

function prevQuestion() {
  if (filteredQuestions.length === 0) return;
  currentIdx = (currentIdx - 1 + filteredQuestions.length) % filteredQuestions.length;
  renderPracticeQuestion();
}

function nextQuestion() {
  if (filteredQuestions.length === 0) return;
  currentIdx = (currentIdx + 1) % filteredQuestions.length;
  renderPracticeQuestion();
}

function normalizeStr(s) {
  return String(s || '')
    .trim()
    .replace(/，|、|,|\//g, ' ')
    .replace(/\s+/g, ' ')
    .toUpperCase();
}

function submitAnswer(qId) {
  const q = questionPool.find(item => item.id === qId);
  if (!q) return;

  let userAns = null;
  let isCorrect = false;

  if (q.type === 'single') {
    const selected = document.querySelector(`input[name="opt-${q.id}"]:checked`);
    if (!selected) { alert('請先選擇一個選項！'); return; }
    userAns = selected.value;
    isCorrect = userAns === q.answer;
  } else if (q.type === 'multi') {
    const checked = Array.from(document.querySelectorAll(`input[name="opt-${q.id}"]:checked`)).map(el => el.value);
    if (checked.length === 0) { alert('請至少勾選一個選項！'); return; }
    userAns = checked;
    const sortedUser = [...checked].sort().join('||');
    const sortedAns = [...q.answer].sort().join('||');
    isCorrect = sortedUser === sortedAns;
  } else {
    const inputEl = document.getElementById(`input-${q.id}`);
    const val = inputEl ? inputEl.value.trim() : '';
    if (!val) { alert('請輸入您的答案後再送出！'); return; }
    userAns = val;
    isCorrect = normalizeStr(val) === normalizeStr(q.answer);
  }

  userProgress[q.id] = { userAns, isCorrect, submitted: true };
  updateStats();
  renderPracticeQuestion();
}

function revealDirectly(qId) {
  const q = questionPool.find(item => item.id === qId);
  if (!q) return;
  if (!userProgress[q.id]) {
    userProgress[q.id] = { userAns: '（直接檢視解答）', isCorrect: false, submitted: true };
    updateStats();
  }
  renderPracticeQuestion();
}

function renderQuestionCardHTML(q, isStudy) {
  const prog = userProgress[q.id];
  const showResult = isStudy ? !studyHideAnswers : (prog && prog.submitted);

  let inputAreaHTML = '';
  if (q.type === 'single') {
    inputAreaHTML = `<div class="space-y-2 my-3">` + q.options.map((opt, idx) => {
      const checked = prog && prog.userAns === opt ? 'checked' : '';
      let badge = '';
      if (showResult) {
        if (opt === q.answer) badge = `<span class="ml-2 text-xs font-bold px-2 py-0.5 rounded bg-emerald-100 text-emerald-800">✔ 正確答案</span>`;
        else if (prog && prog.userAns === opt) badge = `<span class="ml-2 text-xs font-bold px-2 py-0.5 rounded bg-rose-100 text-rose-800">✘ 您的選擇</span>`;
      }
      return `
        <label class="flex items-center p-2.5 rounded-lg border ${showResult && opt === q.answer ? 'border-emerald-500 bg-emerald-50' : 'border-slate-200 hover:bg-slate-50'} cursor-pointer">
          <input type="radio" name="opt-${q.id}" value="${opt}" ${checked} ${isStudy ? 'disabled' : ''} class="w-4 h-4 text-[#0f4c81] mr-3">
          <span class="text-sm font-medium">${opt}</span>
          ${badge}
        </label>`;
    }).join('') + `</div>`;
  } else if (q.type === 'multi') {
    inputAreaHTML = `<div class="space-y-2 my-3">` + q.options.map(opt => {
      const isChecked = prog && Array.isArray(prog.userAns) && prog.userAns.includes(opt) ? 'checked' : '';
      const isRightOpt = q.answer.includes(opt);
      let badge = '';
      if (showResult) {
        if (isRightOpt) badge = `<span class="ml-2 text-xs font-bold px-2 py-0.5 rounded bg-emerald-100 text-emerald-800">✔ 應選項目</span>`;
        else if (isChecked) badge = `<span class="ml-2 text-xs font-bold px-2 py-0.5 rounded bg-rose-100 text-rose-800">✘ 誤選</span>`;
      }
      return `
        <label class="flex items-center p-2.5 rounded-lg border ${showResult && isRightOpt ? 'border-emerald-500 bg-emerald-50' : 'border-slate-200 hover:bg-slate-50'} cursor-pointer">
          <input type="checkbox" name="opt-${q.id}" value="${opt}" ${isChecked} ${isStudy ? 'disabled' : ''} class="w-4 h-4 text-[#0f4c81] rounded mr-3">
          <span class="text-sm font-medium">${opt}</span>
          ${badge}
        </label>`;
    }).join('') + `</div>`;
  } else {
    if (!isStudy) {
      const prevVal = prog && prog.userAns && prog.userAns !== '（直接檢視解答）' ? prog.userAns : '';
      inputAreaHTML = `
        <div class="my-3">
          <input id="input-${q.id}" type="text" value="${prevVal}" placeholder="${q.placeholder || '請輸入答案...'}"
            onkeydown="if(event.key==='Enter') submitAnswer('${q.id}')"
            class="w-full border-2 border-slate-300 focus:border-[#0f4c81] rounded-lg px-3 py-2 text-sm font-medium focus:outline-none" />
        </div>`;
    }
  }

  const actionBtns = !isStudy ? `
    <div class="flex flex-wrap items-center gap-2 mt-3">
      <button onclick="submitAnswer('${q.id}')" class="px-4 py-2 rounded-lg bg-[#0f4c81] hover:bg-sky-800 text-white text-sm font-bold shadow-sm transition">
        送出對答案
      </button>
      <button onclick="revealDirectly('${q.id}')" class="px-3 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-bold transition">
        直接看解答與詳解
      </button>
    </div>` : '';

  const formattedAns = Array.isArray(q.answer) ? q.answer.join('、') : q.answer;
  const statusBanner = (!isStudy && prog && prog.submitted) ? (
    prog.isCorrect
      ? `<div class="mb-2 px-3 py-1.5 rounded-lg bg-emerald-600 text-white text-sm font-bold">🎉 答對了！觀念非常正確！</div>`
      : `<div class="mb-2 px-3 py-1.5 rounded-lg bg-rose-600 text-white text-sm font-bold">💡 答案有誤或已檢視解答（您的作答：${Array.isArray(prog.userAns) ? prog.userAns.join('、') : prog.userAns}）</div>`
  ) : '';

  const answerSectionHTML = showResult ? `
    <div class="mt-4 pt-3 border-t-2 border-dashed border-slate-200 bg-sky-50/70 rounded-lg p-3.5">
      ${statusBanner}
      <div class="text-sm font-bold text-[#0f4c81] mb-1">
        ✅ 標準答案：<span class="text-rose-700 bg-rose-50 border border-rose-200 px-2 py-0.5 rounded">${formattedAns}</span>
      </div>
      <div class="text-xs font-bold text-slate-600 mb-1.5">📚 法規／學理依據：${q.law}</div>
      <div class="text-sm text-slate-700 whitespace-pre-line leading-relaxed bg-white p-2.5 rounded border border-slate-200">${q.explanation}</div>
    </div>` : '';

  return `
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
      <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
        <span class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-sky-100 text-[#0f4c81]">${q.unitName}</span>
        <div class="flex items-center gap-1.5">
          ${q.isCalc ? '<span class="text-xs font-bold px-2 py-0.5 rounded bg-amber-100 text-amber-800">🧮 計算題</span>' : ''}
          <span class="text-xs font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-600">
            ${q.type === 'single' ? '單選題' : q.type === 'multi' ? '複選題' : '填空／問答計算'}
          </span>
        </div>
      </div>
      <h3 class="text-base md:text-lg font-bold text-slate-900 mb-2">${q.title}</h3>
      <div class="text-sm md:text-base text-slate-800 whitespace-pre-line leading-relaxed">${q.stem}</div>
      ${q.mediaHTML || ''}
      ${inputAreaHTML}
      ${actionBtns}
      ${answerSectionHTML}
    </div>
  `;
}

function renderPracticeQuestion() {
  const container = document.getElementById('single-question-container');
  document.getElementById('curr-total').textContent = filteredQuestions.length;

  if (filteredQuestions.length === 0) {
    document.getElementById('curr-index').textContent = 0;
    container.innerHTML = `<div class="bg-white rounded-xl p-8 text-center text-slate-500 border border-slate-200">目前篩選條件下沒有符合的題目，請切換其他單元或清除搜尋關鍵字。</div>`;
    return;
  }

  document.getElementById('curr-index').textContent = currentIdx + 1;
  const q = filteredQuestions[currentIdx];
  container.innerHTML = renderQuestionCardHTML(q, false);
}

function renderStudyList() {
  const container = document.getElementById('study-view');
  if (filteredQuestions.length === 0) {
    container.innerHTML = `<div class="bg-white rounded-xl p-8 text-center text-slate-500 border border-slate-200">目前篩選條件下沒有符合的題目。</div>`;
    return;
  }
  container.innerHTML = filteredQuestions.map((q, i) => `
    <div>
      <div class="text-xs font-bold text-slate-400 mb-1">題號 #${i + 1}</div>
      ${renderQuestionCardHTML(q, true)}
    </div>
  `).join('');
}

function toggleAllStudyAnswers() {
  studyHideAnswers = !studyHideAnswers;
  renderStudyList();
}

// Initialize
updateStats();
renderPracticeQuestion();
</script>
